[package]
name = "galdeck-hid"
description = "Linux userspace driver library for the Stream Deck module built into the Corsair Galleon 100 SD keyboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["encode"]
# Canvas encoding and image loading: Canvas::to_jpeg / load / load_scaled,
# and the draw() methods on Button and Lcd that use them. Without it the
# framework still drives LEDs and uploads pre-encoded JPEGs.
encode = ["dep:image"]

[dependencies]
hidapi = { workspace = true }
ab_glyph = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true }
