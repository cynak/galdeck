[package]
name = "galdeck"
description = "Linux hardware framework for the Stream Deck module built into the Corsair Galleon 100 SD keyboard"
version = "0.2.0"
edition = "2021"
# Verified with `cargo +1.88 check`; the CI msrv job holds it.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cynak/galdeck"
homepage = "https://github.com/cynak/galdeck"
documentation = "https://docs.rs/galdeck"
authors = ["galdeck contributors"]
keywords = ["streamdeck", "corsair", "galleon", "hid", "linux"]
categories = ["hardware-support", "api-bindings"]
readme = "README.md"
exclude = ["captures/", ".github/"]

[features]
default = ["encode"]
# Canvas encoding and image loading: Canvas::to_jpeg / load / load_scaled,
# and the draw() methods on Button and Lcd that use them. Without it the
# framework still drives LEDs and uploads pre-encoded JPEGs.
encode = ["dep:image"]

# The drawing examples need canvas encoding; only `detect` works without it.
# Declared so `cargo check --no-default-features --all-targets` skips them
# instead of failing on methods the feature gates away.
[[example]]
name = "detect"

[[example]]
name = "verify"
required-features = ["encode"]

[[example]]
name = "keycal"
required-features = ["encode"]

[[example]]
name = "calibrate"
required-features = ["encode"]

[dependencies]
# hidraw backend ONLY: the libusb backend detaches kernel drivers, which is
# dangerous on a device that is physically part of a keyboard.
hidapi = { version = "2.6", default-features = false, features = [
    "linux-static-hidraw",
] }
ab_glyph = "0.2"
thiserror = "2"
log = "0.4"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
], optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }

[profile.release]
lto = "thin"
strip = true
