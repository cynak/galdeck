[workspace]
resolver = "2"
members = [
    "crates/galdeck-hid",
    "crates/galdeck-ipc",
    "crates/galdeck-daemon",
    "crates/galdeck-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/cynak/galdeck"
authors = ["galdeck contributors"]

[workspace.dependencies]
galdeck-hid = { path = "crates/galdeck-hid" }
galdeck-ipc = { path = "crates/galdeck-ipc" }

# hidraw backend ONLY: the libusb backend detaches kernel drivers, which is
# dangerous on a device that is physically part of a keyboard.
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"

[profile.release]
lto = "thin"
strip = true
